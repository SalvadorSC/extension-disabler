<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extension Disabler</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header">
      <h1>Extension Disabler</h1>
      <button id="resetButton">Reset All Settings</button>
      <button id="themeToggle">Dark Mode</button>
    </div>
    <button class="collapsible">
      Extensions <span class="arrow">&#9660;</span>
    </button>
    <div class="content" style="max-height: none">
      <input type="text" id="extensionFilter" placeholder="Filter extensions" />
      <div id="extensions">
        <div id="extensionList" class="scrollable"></div>
        <div id="noExtensionsMessage" class="no-results-message">
          No extensions found
        </div>
      </div>
    </div>

    <button class="collapsible">
      Websites <span class="arrow">&#9660;</span>
    </button>
    <div class="content" style="max-height: none">
      <button id="addCurrentWebsite">Add Current Website</button>
      <div class="input-group">
        <input type="text" id="websiteInput" placeholder="Enter website URL" />
        <button id="addWebsite">Add</button>
      </div>
      <input type="text" id="websiteFilter" placeholder="Filter websites" />
      <div id="websites">
        <ul id="websiteList" class="scrollable"></ul>
        <div id="noWebsitesMessage" class="no-results-message">
          No websites found
        </div>
      </div>
    </div>

    <div
      id="refreshDisclaimer"
      class="no-results-message"
      style="display: none"
    >
      Changes detected. Please refresh the page.
      <button id="refreshButton">Refresh</button>
    </div>

    <div class="footer">
      Made by <a href="https://salvasc.dev" target="_blank">salvasc.dev</a>
    </div>
    <div id="ratingReminder" class="rate-extension">
      Enjoying the extension? <br />
      <button id="rateButton">Rate us on the Web Store</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
